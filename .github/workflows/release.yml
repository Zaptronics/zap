name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.mod
      - name: Validate release tag
        shell: bash
        env:
          ZAP_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$ZAP_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
      - run: go test ./...
      - run: go test -tags claims ./internal/zap -run '^TestCurrentClaim' -count=1 -timeout=5m
      - run: go test -tags 'claims owasp' ./internal/zap -run '^TestOWASP' -count=1 -timeout=5m
      - run: go vet ./...

  windows:
    needs: test
    runs-on: windows-latest
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.mod

      - name: Set release version
        shell: pwsh
        env:
          ZAP_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:ZAP_RELEASE_TAG.TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows binary
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force -Path stage, out | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o stage\zap.exe ./cmd/zap

      - name: Azure login for Artifact Signing
        if: ${{ vars.ZAP_SIGN_WINDOWS == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binary
        if: ${{ vars.ZAP_SIGN_WINDOWS == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\stage\zap.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows signature
        if: ${{ vars.ZAP_SIGN_WINDOWS == 'true' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature stage\zap.exe
          $sig | Format-List
          if ($sig.Status -ne 'Valid') { throw "Authenticode signature is not valid: $($sig.Status)" }

      - name: Create Windows archive
        shell: pwsh
        run: |
          Compress-Archive -Path stage\zap.exe -DestinationPath "out\zap_windows_${{ matrix.arch }}.zip"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.mod

      - name: Build universal macOS binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p stage out
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o stage/zap_amd64 ./cmd/zap
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o stage/zap_arm64 ./cmd/zap
          lipo -create -output stage/zap stage/zap_amd64 stage/zap_arm64
          chmod 755 stage/zap
          lipo -info stage/zap

      - name: Import Apple Developer ID certificate
        if: ${{ vars.ZAP_SIGN_MACOS == 'true' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Sign macOS binary
        if: ${{ vars.ZAP_SIGN_MACOS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime \
            --sign '${{ vars.APPLE_SIGNING_IDENTITY }}' stage/zap
          codesign --verify --strict --verbose=2 stage/zap

      - name: Create macOS archive
        shell: bash
        run: |
          set -euo pipefail
          (cd stage && zip -q ../out/zap_darwin_universal.zip zap)

      - name: Notarize macOS archive
        if: ${{ vars.ZAP_SIGN_MACOS == 'true' }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit out/zap_darwin_universal.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: out/*
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.mod

      - name: Build Linux binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p stage out
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o stage/zap ./cmd/zap
          chmod 755 stage/zap
          tar -C stage -czf "out/zap_linux_${{ matrix.arch }}.tar.gz" zap

      - name: Build DEB and RPM packages
        shell: bash
        env:
          NFPM_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          NFPM_VERSION="${GITHUB_REF_NAME#v}"
          for FORMAT in deb rpm; do
            docker run --rm \
              -e NFPM_ARCH="${NFPM_ARCH}" \
              -e NFPM_VERSION="${NFPM_VERSION}" \
              -e NFPM_BINARY=/work/stage/zap \
              -v "$PWD:/work" -w /work \
              goreleaser/nfpm:v2.47.0 package \
              --config packaging/nfpm.yaml \
              --packager "${FORMAT}" \
              --target "out/zap_${NFPM_VERSION}_linux_${NFPM_ARCH}.${FORMAT}"
          done

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --repo "${GITHUB_REPOSITORY}"

  homebrew:
    needs: release
    if: ${{ vars.ZAP_PUBLISH_HOMEBREW == 'true' && vars.ZAP_SIGN_MACOS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern zap_darwin_universal.zip

      - name: Update Zaptronics Homebrew tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256="$(sha256sum zap_darwin_universal.zip | awk '{print $1}')"
          gh repo clone Zaptronics/homebrew-tap tap
          mkdir -p tap/Casks
          cat > tap/Casks/zap.rb <<RUBY
          cask "zap" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/Zaptronics/zap/releases/download/v#{version}/zap_darwin_universal.zip"
            name "Zap"
            desc "Embedded project and dependency tooling for C/CMake"
            homepage "https://github.com/Zaptronics/zap"

            binary "zap"
          end
          RUBY
          cd tap
          git config user.name "Zap release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zap.rb
          git commit -m "zap ${VERSION}"
          git push origin HEAD:main

  winget:
    needs: release
    if: ${{ vars.ZAP_PUBLISH_WINGET == 'true' && vars.ZAP_WINGET_INITIALIZED == 'true' && vars.ZAP_SIGN_WINDOWS == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download WingetCreate
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit WinGet update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          ZAP_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:ZAP_RELEASE_TAG
          $version = $tag.TrimStart('v')
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          $releaseDate = Get-Date -Format 'yyyy-MM-dd'
          .\wingetcreate.exe update Zaptronics.Zap `
            --version $version `
            --urls "$base/zap_windows_amd64.zip|x64" "$base/zap_windows_arm64.zip|arm64" `
            --release-notes-url $releaseUrl `
            --release-date $releaseDate `
            --submit --no-open
