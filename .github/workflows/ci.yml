name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test ./...
      - run: go test -tags claims ./internal/zap -run '^TestCurrentClaim' -count=1 -timeout=5m
      - run: go test -tags 'claims owasp' ./internal/zap -run '^TestOWASP' -count=1 -timeout=5m
      - run: go build ./cmd/zap
